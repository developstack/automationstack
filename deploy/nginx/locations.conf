# 站点的反向代理规则。site-http.conf.template 和 site-https.conf.template 都 include 本文件。
#
# 前端和后端使用同一个域名，按路径分流，所以浏览器中没有跨域请求。
# 路径与 k8s-gitops 的 automationstack/k8s/ingress.yaml 相同。修改时，两处一起改。

# server 允许的最大请求体是 /ingest 的 16 MiB。更小的上限由 server 检查，并返回它自己的 413。
# /files/ 的上限在下面单独设置。
client_max_body_size 16m;

# 错误页和响应头中不显示 nginx 的版本号。
server_tokens off;

# 压缩文本响应。图片和视频已经是压缩格式，所以不在列表中。
# server 已经压缩的 JSON 带有 Content-Encoding，nginx 不再压缩它。
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css text/plain application/javascript application/json image/svg+xml;

proxy_http_version 1.1;
proxy_set_header Host $host;
# 总是用连接地址覆盖客户端发来的 X-Real-IP。server 用它做登录限流（CLIENT_IP_HEADER）。
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# /ws 是 WebSocket。$connection_upgrade 在站点模板中由 map 定义。
# 写在 server 级：location 中只要写了一条 proxy_set_header，就不再继承上面这些。
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

location = /health {
    proxy_pass http://server:3000;
}

location /rpc {
    proxy_pass http://server:3000;
}

location /api {
    proxy_pass http://server:3000;
}

location /ingest {
    proxy_pass http://server:3000;
}

# 本地存储的上传和下载（存储方式是「服务器本地」时）。
# 上传：执行页附件的上限是 20 MiB，这里多留 1 MiB。
# proxy_request_buffering off：nginx 不先把整个文件写到自己的磁盘，而是直接转发给 server。
# 下载：server 只检查签名，然后用 X-Accel-Redirect 指向下面的 /_files/。
location /files/ {
    client_max_body_size 21m;
    proxy_request_buffering off;
    proxy_pass http://server:3000;
}

# nginx 从 files 卷中直接发送文件，并处理 Range（视频拖动）、ETag 和条件请求。
# internal：客户端不能直接访问这个路径，只能经过 server 的签名检查。
# server 设置的 Content-Type 和 Cache-Control 保留在响应中。其他响应头不保留，所以在这里设置安全头：
# 上传的内容来自用户，并且与平台在同一个域名下。
location /_files/ {
    internal;
    alias /srv/automationstack/files/;
    sendfile on;
    tcp_nopush on;
    open_file_cache max=2000 inactive=60s;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
}

# 实时协作。连接空闲 1 小时后才断开。
location = /ws {
    proxy_pass http://server:3000;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# MCP 的响应可以是事件流，所以不缓冲。
location /mcp {
    proxy_pass http://server:3000;
    proxy_buffering off;
    proxy_read_timeout 1h;
}

location / {
    proxy_pass http://web:3001;
}
