# 站点的反向代理规则。site-http.conf.template 和 site-https.conf.template 都 include 本文件。
#
# 前端和后端使用同一个域名，按路径分流，所以浏览器中没有跨域请求。
# 路径与 k8s-gitops 的 automationstack/k8s/ingress.yaml 相同。修改时，两处一起改。

# server 允许的最大请求体是 /ingest 的 16 MiB。更小的上限由 server 检查，并返回它自己的 413。
client_max_body_size 16m;

proxy_http_version 1.1;
proxy_set_header Host $host;
# 总是用连接地址覆盖客户端发来的 X-Real-IP。server 用它做登录限流（CLIENT_IP_HEADER）。
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# /ws 是 WebSocket。$connection_upgrade 在站点模板中由 map 定义。
# 写在 server 级：location 中只要写了一条 proxy_set_header，就不再继承上面这些。
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

location = /health {
    proxy_pass http://server:3000;
}

location /rpc {
    proxy_pass http://server:3000;
}

location /api {
    proxy_pass http://server:3000;
}

location /ingest {
    proxy_pass http://server:3000;
}

# 实时协作。连接空闲 1 小时后才断开。
location = /ws {
    proxy_pass http://server:3000;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# MCP 的响应可以是事件流，所以不缓冲。
location /mcp {
    proxy_pass http://server:3000;
    proxy_buffering off;
    proxy_read_timeout 1h;
}

location / {
    proxy_pass http://web:3001;
}
