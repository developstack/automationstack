packages:
  - apps/*
  - packages/*
  # 示例工程（examples/nodejs 等）：它们要用 workspace:* 引 SDK，
  # 不进工作区就只能写相对路径 file: 依赖，那份 README 抄给用户就是错的。
  - examples/*
allowBuilds:
  esbuild: true
  sharp: true
  lefthook: true
  unrs-resolver: true
  # 下面两条随 @earendil-works/pi-ai 传进来，都是我们**永远不会加载**的 provider SDK 链上的：
  # pi 把 google / aws / anthropic 三家的 SDK 藏在 `api/*.lazy.js` 的静态字符串 import() 后面，
  # 我们只走 OpenAI 兼容端点，实测跑完一整轮 agent loop 只加载 10 个包，这两个一次都没进来。
  # 但只要它们躺在 node_modules 里，不显式表态 pnpm 就 ERR_PNPM_IGNORED_BUILDS 让整个安装失败，
  # 所以必须写在这儿。写 false 而不是 true：build 脚本产出的东西我们用不到，
  # 少跑两个 install 期脚本就少两处供应链面。
  '@google/genai': false
  protobufjs: false
  # 下面两条随 @wdio/cli 传进来（examples/nodejs 的 WebdriverIO 示例）。
  # edgedriver 有 `install`、geckodriver 有 `postinstall`，都是 install 期脚本。
  # 写 false：示例只驱动 Chrome，而 Chrome 的 driver 是 wdio 在**运行期**按需下载的
  # （≥8.14 的自动驱动管理），不经过这两个包；实测示例四条路径全绿那几轮，
  # 这两个 build 一次都没跑过，产物我们用不到，少跑两个脚本就少两处供应链面。
  #
  # ⚠️ 必须显式写在这里，否则 CI 必红：本机热状态（node_modules + .modules.yaml 都在）
  # 装它们不会被点名，看起来毫无问题；但 CI 是冷检出 + `pnpm install --frozen-lockfile`。
  # 2026-08-26 在独立克隆里做过冷装复现，原文是：
  #   [ERR_PNPM_IGNORED_BUILDS] Ignored build scripts: edgedriver@6.3.0, geckodriver@6.1.1
  edgedriver: false
  geckodriver: false
  # 下面两条随 dockerode → docker-modem → ssh2 传进来（apps/farm 要连 Docker daemon）。
  # 写 false：这两个 build 产的都是**可选的原生加速**，不是功能开关——
  # ssh2 的 native binding 只加速加密运算，cpu-features 只是给它探 CPU 指令集；
  # 装不上时 ssh2 自己回落到纯 JS 实现，`ssh://` 形态的 FARM_DOCKER_HOST 照样能连。
  # 换来的是少两处编译期供应链面（cpu-features 是要过 node-gyp 的原生扩展）。
  # 而默认根本走不到它们：FARM_DOCKER_HOST 默认是本地 unix socket。
  cpu-features: false
  ssh2: false
catalog:
  dotenv: 17.4.2
  zod: 4.4.3
  typescript: 6.0.3
  "@types/node": 22.20.1
  hono: 4.13.2
  "@orpc/server": 1.15.0
  "@orpc/openapi": 1.15.0
  "@orpc/zod": 1.15.0
  lucide-react: 1.31.0
  react: 19.2.8
  recharts: 3.10.1
  react-dom: 19.2.8
  sonner: 2.0.8
  tailwindcss: 4.3.3
  "@orpc/client": 1.15.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  # apps/farm 用：dockerode 钉 4.x 而不是 5.x —— DefinitelyTyped 的
  # @types/dockerode 仍然只跟到 4（4.0.1 发布于 dockerode 5 之前），
  # 混搭会让 provider 那层的类型和真实 API 悄悄错位。两个大版本的依赖树
  # 一样重（都拖 @grpc/grpc-js + protobufjs，后者的 build 已在 allowBuilds 里表过态）。
  dockerode: 4.0.12
  "@types/dockerode": 4.0.1
  # ws 与 apps/server 里那份字面量 8.21.3 同版本：两个 app 都要跑 WS，
  # 版本漂开只会白装两份。server 的字面量没顺手改成 catalog:，那是它的改动面。
  ws: 8.21.3
  "@types/ws": 8.18.1
# 24 小时冷静期。**这个值和 pnpm 11 的内置默认值一模一样，删掉它却会改变行为**——
# 所以它看着冗余，其实是这段配置里唯一一个开关。别当成 noise 清掉。
#
# 机制（读的是实际在跑的二进制 pnpm 11.17.0，corepack 缓存里那份 pnpm.mjs）：
#   if (explicitlySetKeys.has("minimumReleaseAge") && minimumReleaseAgeStrict == null)
#       minimumReleaseAgeStrict = true;
# 即 strict 的默认值不取决于**值是多少**，而取决于**这个键有没有被显式写出来**。
# 吃默认值 = strict false；显式写出来（哪怕写的就是 1440）= strict true。
#
# strict 为 false 时，`pnpm add` 遇到不够龄的包不会失败，而是照装，
# 并**自己往下面的 minimumReleaseAgeExclude 里追加条目**。这不是推测，2026-08-28
# 在一份一次性克隆里当场重现过（探针选了当时发布不到一小时的 rollup@4.63.1）：
#
#   不写这一行：  pnpm add -w rollup@4.63.1  → EXIT=0，装上，
#                 pnpm 自报「Added 26 entries to minimumReleaseAgeExclude
#                 in pnpm-workspace.yaml」，26 条豁免直接落进版本库
#   写了这一行：  同一条命令              → EXIT=1
#                 ERR_PNPM_NO_MATURE_MATCHING_VERSION，自动追加 0 条
#
# 一次 pnpm add 就能凭空长出 26 条没人看过的豁免——这正是 2026-08-28 删掉的那 9 条
# （@hono/mcp + vitest 家族）的来历：不是有人偷懒没写注释，是**根本没有人做过那个决定**，
# 工具替你按了「同意」，还把同意记录 commit 了进去。一条豁免的全部意义在于
# 「有人看过并且拍了板」，自动生成的豁免把这个意义清零，却和人写的那两条长得一模一样。
# 写上这一行之后，要放行必须人手往下面那张表里加，并留下审计注释——和 blobatar 那两条一样。
#
# 对 CI 无影响，理由不是「大概不会」而是走的根本不是同一条路：
#   - 解析期（pnpm add / update）：看 strict，行为如上。
#   - lockfile 审计期（pnpm install --frozen-lockfile，CI 只走这条）：**完全不看 strict**。
#     实测过：显式配一个大值时，写不写 minimumReleaseAgeStrict: false 都照样失败，
#     输出几乎一字不差。而这里写的 1440 与原本生效的默认值数值相同，审计策略不变。
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # blobatar 2026-08-16 首发、@blobatar/react 2026-08-19 首发，装的时候都不满 release age。
  # 钉死精确版本而不是 caret：豁免的是「这一个已经审过的版本」，不是这个包以后的任何发布，
  # 升级必须是一次显式改动。审计结论：无 install 生命周期脚本、零运行时依赖、
  # dist 与 src 里无 fetch/eval/child_process/process.env 等外联或动态执行。
  - blobatar@2.4.0
  - '@blobatar/react@2.4.0'
