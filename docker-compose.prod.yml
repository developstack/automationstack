# 单机生产部署。make up:prod 使用本文件，见 README「单机生产部署」。
#
# 与 docker-compose.yml 的区别：
#   - 没有 postgres 服务。数据库在外部机器上，连接串是 .env.prod 中的 DATABASE_URL。
#   - nginx 是唯一对外的入口（80、443）。server 和 web 不发布端口。
#   - 前端和后端使用同一个域名 https://${DOMAIN}，nginx 按路径分流（deploy/nginx/locations.conf）。
#     浏览器中没有跨域请求。VITE_SERVER_URL 和 CORS_ORIGIN 都由 DOMAIN 得出，所以两者总是相同。
#   - HTTPS 证书来自 Let's Encrypt。certbot 服务自动续期。
#   - 所有配置来自一个文件 .env.prod（模板 .env.prod.example）。make up:prod 把它的路径
#     传给 --env-file（展开下面的 ${...}）和 PROD_ENV_FILE（server 与 migrate 的 env_file）。
#   - 镜像 tag 是 :prod，项目名是 automationstack-prod。它与本地开发的容器和镜像互不影响。
#
# 集群上的正式生产环境不使用本文件：它由 developstack/k8s-gitops 中的 automationstack/k8s 管理。
name: automationstack-prod

# 默认的 json-file 日志没有大小上限，长期运行会写满磁盘。
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: nginx:1.28-alpine
    init: true
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?在 .env.prod 中设置 DOMAIN}
    volumes:
      - ./deploy/nginx:/etc/nginx/automationstack:ro
      # 官方镜像在启动时执行 /docker-entrypoint.d/ 中有执行权限的 .sh 脚本。
      - ./deploy/nginx/40-select-site.sh:/docker-entrypoint.d/40-automationstack-select-site.sh:ro
      - ./deploy/nginx/50-reload-loop.sh:/docker-entrypoint.d/50-automationstack-reload-loop.sh:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/certbot:ro
    depends_on:
      # nginx 启动时解析 proxy_pass 中的主机名。server 和 web 不存在时，nginx 不能启动。
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  # 每 12 小时检查一次证书。证书在 30 天内到期时，certbot 续期它。
  # 第一张证书由 make up:prod 申请（deploy/certbot/ensure-cert.sh）。
  certbot:
    image: certbot/certbot:v4.0.0
    init: true
    environment:
      DOMAIN: ${DOMAIN:?在 .env.prod 中设置 DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/certbot:/opt/automationstack:ro
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
    entrypoint:
      - sh
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --quiet
          sleep 43200 & wait
        done
    logging: *logging
    restart: unless-stopped

  web:
    image: automationstack-web:prod
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # 构建期变量：值写进前端产物。make up:prod 每次都构建，所以修改 DOMAIN 后也生效。
        VITE_SERVER_URL: https://${DOMAIN:?在 .env.prod 中设置 DOMAIN}
    init: true
    # web 不读取 .env.prod：其中的数据库口令和密钥与 web 无关。
    environment:
      # 只用于 SSR：容器内直接通过 compose 网络访问 server。
      SERVER_URL: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    restart: unless-stopped

  server:
    image: automationstack-server:prod
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    env_file:
      - path: ${PROD_ENV_FILE:-.env.prod}
        required: true
    environment:
      # environment 的优先级高于 env_file。这几项不由 .env.prod 决定。
      NODE_ENV: production
      PORT: "3000"
      # 必须与浏览器中的 origin 完全相同。WebSocket 的来源检查是精确比较。
      CORS_ORIGIN: https://${DOMAIN:?在 .env.prod 中设置 DOMAIN}
      # 登录限流按客户端 IP 计数。server 在 nginx 后面，TCP 连接的地址总是 nginx 的地址，
      # 所以使用 nginx 写入的 X-Real-IP。nginx 总是用连接地址覆盖它，客户端不能伪造。
      # server 不发布端口，所以只能经过 nginx 访问。
      CLIENT_IP_HEADER: x-real-ip
    extra_hosts:
      # Linux 上的 docker 没有默认的 host.docker.internal。数据库在宿主机上时使用它。
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # 第一次启动时，pg-boss 在外部库中创建 schema pgboss。
      start_period: 30s
    logging: *logging
    restart: unless-stopped

  # 一次性迁移：执行 packages/db/src/migrations 中还没有应用的 SQL。
  # profile 使 `docker compose up` 不启动它。make up:prod 在启动任何服务之前，
  # 用 `docker compose run --rm migrate` 执行它。它失败时，make up:prod 停止，正在运行的旧服务不变。
  migrate:
    profiles: ["migrate"]
    # 与 server 使用同一个镜像，所以迁移与服务的代码总是来自同一次构建。
    image: automationstack-server:prod
    init: true
    # drizzle.config.ts 从当前目录读取，其中 out 是相对路径 ./src/migrations。
    working_dir: /app/packages/db
    env_file:
      - path: ${PROD_ENV_FILE:-.env.prod}
        required: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 两步：
    #   1. 预检：用 node-postgres 连接一次外部库。drizzle-kit 连接失败时不显示错误原文，
    #      预检显示 PostgreSQL 的错误原文，不显示连接串。
    #   2. drizzle-kit migrate。已应用的迁移记录在 drizzle.__drizzle_migrations 中，重复执行不做任何修改。
    # 脚本中不能出现 $：compose 会把它当作变量展开。
    command:
      - sh
      - -c
      - |
        set -eu
        node -e '
          const { Client } = require("pg");
          const client = new Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 10000 });
          client.connect()
            .then(() => client.query("SELECT current_user AS role, current_database() AS db"))
            .then((result) => {
              const row = result.rows[0];
              console.log("✅ 预检：已连接库 " + row.db + "（角色 " + row.role + "）");
              return client.end();
            })
            .catch((error) => {
              console.error("❌ 预检：不能连接数据库：" + error.message);
              console.error("   password authentication failed：DATABASE_URL 中的口令错误。");
              console.error("   database ... does not exist：库还没有创建。");
              console.error("   no pg_hba.conf entry：数据库机器的 pg_hba.conf 不允许本服务器的地址。");
              console.error("   ECONNREFUSED 或 timeout：主机或端口错误，或防火墙阻止了连接。");
              process.exit(1);
            });
        '
        exec /app/packages/db/node_modules/.bin/drizzle-kit migrate
    restart: "no"

volumes:
  # 证书和账号。make down:prod 不删除它，所以重新部署时不重新申请证书。
  letsencrypt:
  # Let's Encrypt 验证用的文件。certbot 写入，nginx 读取。
  acme-webroot:
