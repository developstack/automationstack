name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上后推的提交会取消前一次尚未跑完的流水线。
# main 上不取消：那里的每一次运行都要产出镜像。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # 与根 package.json 的 packageManager 字段、以及两个 Dockerfile 里的
  # node:24-slim 保持一致。三处都改才算改完。
  NODE_VERSION: "24"

jobs:
  check:
    name: 类型 / 测试 / 规约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 不写 version：action 会读根 package.json 的 packageManager
      # （pnpm@11.17.0），避免在两个地方各写一遍版本号。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 三步互不依赖，但刻意串行：任何一步挂了都要能一眼看出是哪一步，
      # 并行进 matrix 只会为省下不到一分钟而把日志摊开到三个 job 里。
      - name: 类型检查
        run: pnpm check-types

      # vitest 的五个 project（web / api / server / db / sdk）全是 node 环境的
      # 纯函数测试，不连库、不连网、不需要任何环境变量（见根 vitest.config.ts）。
      # ⚠️ 这个数是要对着输出核的：root 指向不存在的目录时 vitest 静默跳过、
      # 退出码照样是 0，少跑一整个 project 在日志上和「跑了且全过」长得一样。
      - name: 单元测试
        run: pnpm test

      - name: 代码规约（Biome / Ultracite）
        run: pnpm check

      # eslint 与上面的 Biome 不重叠：这里管的是 Biome 没有的那几条
      # ——函数行数、圈复杂度、consistent-return、no-non-null-assertion。
      # 本地 lefthook 的 eslint-rules 只跑暂存的文件，所以存量问题从不显形；
      # 这里对全仓跑一次，才是真正的那道网。
      #
      # ⚠️ 这一步需要显式抬堆，默认的不够。eslint 开了 projectService: true
      # （全类型感知），typescript-eslint 会为每棵 tsconfig 建一份 program 并
      # 同时持有。examples/nodejs 从 .js 改成 TS 之后多出第二份，而且它带着
      # DOM + @wdio/globals/types + expect-webdriverio 这一大坨环境类型。
      #
      # 私有仓的 runner 是 7GB，Node 默认堆落在 ~2GB，于是 2026-08-26 这里
      # 直接 `FATAL ERROR: ... JavaScript heap out of memory` + SIGABRT。
      # 本机按同样上限量过，是**叠加**超标、不是哪一边单独超标：
      #   2048MB 全仓（含 examples/nodejs） → OOM
      #   2048MB 全仓（排除它）             → 通过，69 warnings
      #   2048MB 只 lint examples/nodejs    → 通过，21 warnings
      #   4096MB 全仓                       → 通过，90 warnings（69+21）
      #
      # 二分出来的真实需求落在 **(2048, 2176]**：2176MB 就能过（90 warnings），
      # 2048MB 崩。所以 4096 约是 1.9 倍余量。留这个基线是给下一个撞上的人用的
      # ——他需要知道的不是「曾经不够」，而是「上次量出来需要多少」，
      # 有基线才判断得出这次是正常增长还是别处出了异常。
      #
      # 不建议为了保险再往上加（比如 6144）：runner 只有 7GB，给别的进程留太少
      # 会换一种炸法。这个失败模式是**硬崩**（SIGABRT），不会先变慢给预警，
      # 所以真要涨也该是量完再涨。
      #
      # 不走「砍掉 examples/nodejs 的 types 把类型图缩小」那条路：那几个 types
      # 是 wdio 两个 spec 过 check-types 必需的，砍了会让 eslint 和 tsc 各说各话。
      - name: eslint（行数 / 复杂度）
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm eslint --no-cache .

      # 仓库自有的三条硬规则，本地由 lefthook 在提交前跑（只跑暂存的文件），
      # 这里对全仓补一道网。lefthook 那道 `git commit --no-verify` 一句就绕过了，
      # 所以服务端这一道才是真正拦得住的那个——依赖版本白名单尤其如此，
      # 发版这件事整个押在 package.json 的版本号写法正确上。
      #
      # 三个脚本都只认「文件列表」参数，文件列表必须显式喂进去。
      # check-package-json.js 传空会 exit 1（它自己就把「零文件」当失败）；
      # 另外两个传空只会打印「没有文件需要检查」然后 exit 0——那是空跑，不是通过，
      # 而且它们成功时也不打检查计数，日志上「全过了」和「一个都没查」一字不差。
      # 所以在调用之前先断言两张列表非空：哪天 glob 写错、或者文件被整体挪走，
      # 要的是一次响亮的失败，而不是一次安静的全绿。
      #
      # 用 git ls-files 而不是 find：只有进了版本库的文件才该被检查，
      # 顺带天然排除 node_modules 与各 app 的构建产物。
      - name: 仓库自有规则
        run: |
          set -euo pipefail
          files=$(git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' '*.cjs' '*.mjs' '*.cts' '*.mts')
          pkg_files=$(git ls-files '**/package.json' 'package.json')
          if [ -z "$files" ]; then
            echo "::error::源码文件列表为空，check-tailwind / check-file-rules 会空跑成假绿"
            exit 1
          fi
          if [ -z "$pkg_files" ]; then
            echo "::error::package.json 列表为空，依赖版本白名单这一道等于没跑"
            exit 1
          fi
          echo "待检查：$(echo "$files" | wc -l) 个源码文件，$(echo "$pkg_files" | wc -l) 个 package.json"
          # 故意不加引号：这里要的就是按空白拆成多个参数（仓库内无带空格的路径）。
          node scripts/check-tailwind.js $files
          node scripts/check-file-rules.js $files
          node scripts/check-package-json.js $pkg_files

      # 门禁脚本自己的单测。它们是 `node --test` 的 .test.mjs，落在 scripts/ 与
      # eslint-rules/ 下；而 vitest 每个 project 的 include 都是 `src/**/*.test.ts`，
      # 所以 `pnpm test` 一个都跑不到——不在这里跑，就是谁都不跑。
      # 门禁自身写错（比如豁免写宽了、判定漏了一类）不会有任何信号，
      # 而门禁失灵的表现恰恰是「全绿」，本仓在假绿上翻过车，这道必须有。
      - name: 门禁脚本自测
        run: node --test scripts/*.test.mjs eslint-rules/*.test.mjs

      # apps/web/public/install-agent-skill.sh 里内嵌着 .claude/skills/ 两个 skill
      # 的正文（它是发给用户的单文件离线安装器，正文必须在它自己肚子里）。
      # 内嵌的那份是生成物：改了 skill 却忘了重新生成，用户装到的就是旧的一套，
      # 而这种漂移在本地看不出来——所以在这里卡一道。
      # 失败时的修法：node scripts/build-install-agent-skill.js
      - name: 安装脚本内嵌的 skill 未漂移
        run: node scripts/build-install-agent-skill.js --check

  docker:
    name: 构建镜像 (${{ matrix.app }})
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, server]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # 只有 main 上的推送才登录并推镜像；PR 只构建，不推。
      # 外部 fork 发来的 PR 拿不到 packages:write，登录必然失败——
      # 这个条件同时也是那道防线。
      - name: 登录 GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 只在 main 推送、且是 web 时校验：localhost 兜底只对本地 / PR 构建有意义，
      # 一旦推上 GHCR 并被 GitOps 部署到生产，就是一个页面能开、请求全打向访客
      # 自己 localhost 的静默坏镜像（见下方构建步骤的说明）。所以这里直接失败，
      # 而不是 warning——warning 没人看，而镜像一旦推上去、tag 一旦写回就已经上线了。
      # server 镜像不烘这个变量，不受影响；PR 不推镜像，保留兜底。
      - name: 校验 VITE_SERVER_URL 已配置
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.app == 'web'
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: |
          if [ -z "${VITE_SERVER_URL}" ]; then
            echo "::error::仓库变量 VITE_SERVER_URL 未配置。web 镜像会把它在构建期烘进前端产物，兜底的 http://localhost:3000 推到 GHCR 并部署后整站请求都会失败。请到 Settings -> Secrets and variables -> Actions -> Variables 设为生产后端地址（如 https://testcase.trendf.top）。"
            exit 1
          fi
          echo "::notice::web 镜像将烘入 VITE_SERVER_URL=${VITE_SERVER_URL}"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # 两个 Dockerfile 的 context 都是仓库根（compose 里也是这么配的），
      # 因为 pnpm workspace 的构建需要看到整棵 monorepo。
      #
      # VITE_SERVER_URL 只对 web 有意义，它在构建期被烘进前端产物，
      # 所以必须在这里给定而不能留到运行时。默认值与 docker-compose.yml
      # 里的 build args 一致；要发到别的域名就在仓库 Variables 里设同名变量。
      # 它是公开的后端地址，不是密钥，放 vars 而不是 secrets。
      #
      # ⚠️ **没设仓库 Variable 时兜底的 http://localhost:3000 会被烤进推上 GHCR
      # 的那个镜像里，而且运行期改不掉**（apps/web/Dockerfile 的 ARG/ENV 只在
      # 构建阶段生效）。别人 pull 这个镜像部署到自己机器，页面能打开，
      # 但每一个请求都打向**访问者浏览器自己的 localhost:3000**——服务端日志里
      # 一条请求都没有，最难查的一类症状。
      # 发布镜像之前必须在仓库 Settings → Variables 里把 VITE_SERVER_URL
      # 设成真实的对外后端地址；改了地址就得重新构建镜像，重启没用。
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SERVER_URL=${{ vars.VITE_SERVER_URL || 'http://localhost:3000' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # 把新镜像 tag 写回 GitOps 仓库（developstack/k8s-gitops 的 automationstack/k8s），
  # 由集群里的 ArgoCD 拉取部署。约定与 aidevstack / nimbus-docs 一致：
  #   Variables: GITOPS_REPO（必填才写回，没配则跳过并给 notice）
  #              GITOPS_OVERLAY_PATH（可选，默认 automationstack/k8s）
  #   Secrets:   GITOPS_DEPLOY_KEY（首选，SSH 可写 deploy key）
  #              GITOPS_TOKEN（备选，fine-grained PAT，Contents: Read and write）
  # 两个镜像在**同一个提交**里一起改，避免 web / server 版本错位的中间态。
  gitops:
    name: 写回 GitOps 仓库
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 写回的目标是另一个仓库，用的是 deploy key / PAT，不碰 GITHUB_TOKEN。
    permissions:
      contents: read
    # 串行化 main 上的写回；不取消在途的（取消点可能落在两次写之间）。
    # key 写死而不用 github.workflow，免得改 name 后新旧 run 落进不同 group。
    concurrency:
      group: automationstack-gitops-writeback
      cancel-in-progress: false
    env:
      GITOPS_REPO: ${{ vars.GITOPS_REPO }}
      GITOPS_PATH: ${{ vars.GITOPS_OVERLAY_PATH || 'automationstack/k8s' }}
      GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: 计算镜像坐标
        id: img
        run: |
          set -euo pipefail
          if [ -z "${GITOPS_REPO}" ]; then
            echo "::notice::仓库变量 GITOPS_REPO 未配置，跳过写回 GitOps 仓库（镜像已推送，但不会自动部署）。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${GITOPS_DEPLOY_KEY}" ] && [ -z "${GITOPS_TOKEN}" ]; then
            echo "::error::缺少写 ${GITOPS_REPO} 的凭据：请配 secret GITOPS_DEPLOY_KEY（首选，SSH 可写 deploy key）或 GITOPS_TOKEN（备选，fine-grained PAT）。"
            exit 1
          fi
          # 与 docker job 里 metadata-action 同一口径：镜像名全小写，
          # 短 tag = sha- + github.sha 前 7 位。
          repo="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "enabled=true"
            echo "tag=sha-${GITHUB_SHA:0:7}"
            echo "server=ghcr.io/${repo}-server"
            echo "web=ghcr.io/${repo}-web"
          } >> "$GITHUB_OUTPUT"

      - name: 配置凭据并克隆 GitOps 仓库
        if: steps.img.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if [ -n "${GITOPS_DEPLOY_KEY}" ]; then
            echo "::notice::写回 ${GITOPS_REPO} 的 ${GITOPS_PATH}（SSH deploy key）"
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "${GITOPS_DEPLOY_KEY}" > ~/.ssh/gitops_key
            chmod 600 ~/.ssh/gitops_key
            ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            cat >> ~/.ssh/config <<'EOF'
          Host github.com
            User git
            IdentityFile ~/.ssh/gitops_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
            chmod 600 ~/.ssh/config
            git clone --depth 1 "git@github.com:${GITOPS_REPO}.git" gitops
          else
            echo "::notice::写回 ${GITOPS_REPO} 的 ${GITOPS_PATH}（HTTPS + GITOPS_TOKEN；PAT 会过期，建议改用 deploy key）"
            # 凭据放 HTTP 头而不是 remote URL，免得 token 出现在 .git/config / 报错回显里。
            cred="$(printf '%s' "x-access-token:${GITOPS_TOKEN}" | base64 -w0)"
            echo "::add-mask::${cred}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${cred}" \
              clone --depth 1 "https://github.com/${GITOPS_REPO}.git" gitops
            git -C gitops config "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${cred}"
          fi

      - name: 确保 kustomize 可用
        if: steps.img.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if ! command -v kustomize >/dev/null 2>&1; then
            ver=v5.8.1
            curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${ver}/kustomize_${ver}_linux_amd64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin kustomize
          fi
          kustomize version

      - name: 写回镜像 tag 并推送
        if: steps.img.outputs.enabled == 'true'
        env:
          TAG: ${{ steps.img.outputs.tag }}
          IMAGE_SERVER: ${{ steps.img.outputs.server }}
          IMAGE_WEB: ${{ steps.img.outputs.web }}
        run: |
          set -euo pipefail
          gitops="${GITHUB_WORKSPACE}/gitops"
          kfile="${gitops}/${GITOPS_PATH}/kustomization.yaml"

          git -C "${gitops}" config user.name  'github-actions[bot]'
          git -C "${gitops}" config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ ! -f "${kfile}" ]; then
            echo "::error::${GITOPS_REPO} 里找不到 ${GITOPS_PATH}/kustomization.yaml。"
            exit 1
          fi

          # 先站到 GitOps 仓库分支的最新顶端、再在其上重算（kustomize edit set image
          # 是覆盖写），push 被拒就重来；这样不存在 rebase 冲突。
          for attempt in 1 2 3; do
            git -C "${gitops}" fetch --no-tags origin
            branch="$(git -C "${gitops}" rev-parse --abbrev-ref HEAD)"
            git -C "${gitops}" reset --hard "origin/${branch}"

            # `kustomize edit set image` 对不存在的名字是"新增一条"而非报错，
            # 会留下谁都不匹配的 images 项（部署 ImagePullBackOff 但 CI 全绿）。
            # 所以先断言两个占位名都在，且必须与清单里一字不差。
            for placeholder in automationstack-server automationstack-web; do
              if ! grep -qE "^[[:space:]]*-?[[:space:]]*name:[[:space:]]*${placeholder}[[:space:]]*$" "${kfile}"; then
                echo "::error::${GITOPS_REPO} 的 ${GITOPS_PATH}/kustomization.yaml 里没有占位名 ${placeholder}。"
                exit 1
              fi
            done

            ( cd "${gitops}/${GITOPS_PATH}" || exit 1
              kustomize edit set image \
                "automationstack-server=${IMAGE_SERVER}:${TAG}" \
                "automationstack-web=${IMAGE_WEB}:${TAG}" )

            if git -C "${gitops}" diff --quiet -- "${GITOPS_PATH}/kustomization.yaml"; then
              echo "镜像 tag 已经是 ${TAG}，不提交。"
              exit 0
            fi

            git -C "${gitops}" add "${GITOPS_PATH}/kustomization.yaml"
            git -C "${gitops}" commit \
              -m "chore(automationstack): image -> ${TAG}" \
              -m "Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
              -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

            if git -C "${gitops}" push origin "HEAD:${branch}"; then
              echo "已把 ${TAG} 写回 ${GITOPS_REPO} 的 ${branch}，等待 ArgoCD 同步。"
              exit 0
            fi
            echo "::warning::push 被拒（${GITOPS_REPO} 的 ${branch} 有新提交），第 ${attempt}/3 次重算后重试。"
            sleep $(( attempt * 5 ))
          done

          echo "::error::连续 3 次写回 ${GITOPS_REPO} 失败。镜像已在 ghcr，Re-run failed jobs 即可。"
          exit 1

      - name: 清理凭据
        if: always() && steps.img.outputs.enabled == 'true'
        run: |
          rm -f ~/.ssh/gitops_key ~/.ssh/config
          git -C gitops config --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
