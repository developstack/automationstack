name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上后推的提交会取消前一次尚未跑完的流水线。
# main 上不取消：那里的每一次运行都要产出镜像。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # 与根 package.json 的 packageManager 字段、以及两个 Dockerfile 里的
  # node:24-slim 保持一致。三处都改才算改完。
  NODE_VERSION: "24"

jobs:
  check:
    name: 类型 / 测试 / 规约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 不写 version：action 会读根 package.json 的 packageManager
      # （pnpm@11.17.0），避免在两个地方各写一遍版本号。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 三步互不依赖，但刻意串行：任何一步挂了都要能一眼看出是哪一步，
      # 并行进 matrix 只会为省下不到一分钟而把日志摊开到三个 job 里。
      - name: 类型检查
        run: pnpm check-types

      # vitest 的五个 project（web / api / server / db / sdk）全是 node 环境的
      # 纯函数测试，不连库、不连网、不需要任何环境变量（见根 vitest.config.ts）。
      # ⚠️ 这个数是要对着输出核的：root 指向不存在的目录时 vitest 静默跳过、
      # 退出码照样是 0，少跑一整个 project 在日志上和「跑了且全过」长得一样。
      - name: 单元测试
        run: pnpm test

      - name: 代码规约（Biome / Ultracite）
        run: pnpm check

      # eslint 与上面的 Biome 不重叠：这里管的是 Biome 没有的那几条
      # ——函数行数、圈复杂度、consistent-return、no-non-null-assertion。
      # 本地 lefthook 的 eslint-rules 只跑暂存的文件，所以存量问题从不显形；
      # 这里对全仓跑一次，才是真正的那道网。
      #
      # ⚠️ 这一步需要显式抬堆，默认的不够。eslint 开了 projectService: true
      # （全类型感知），typescript-eslint 会为每棵 tsconfig 建一份 program 并
      # 同时持有。examples/nodejs 从 .js 改成 TS 之后多出第二份，而且它带着
      # DOM + @wdio/globals/types + expect-webdriverio 这一大坨环境类型。
      #
      # 私有仓的 runner 是 7GB，Node 默认堆落在 ~2GB，于是 2026-08-26 这里
      # 直接 `FATAL ERROR: ... JavaScript heap out of memory` + SIGABRT。
      # 本机按同样上限量过，是**叠加**超标、不是哪一边单独超标：
      #   2048MB 全仓（含 examples/nodejs） → OOM
      #   2048MB 全仓（排除它）             → 通过，69 warnings
      #   2048MB 只 lint examples/nodejs    → 通过，21 warnings
      #   4096MB 全仓                       → 通过，90 warnings（69+21）
      #
      # 二分出来的真实需求落在 **(2048, 2176]**：2176MB 就能过（90 warnings），
      # 2048MB 崩。所以 4096 约是 1.9 倍余量。留这个基线是给下一个撞上的人用的
      # ——他需要知道的不是「曾经不够」，而是「上次量出来需要多少」，
      # 有基线才判断得出这次是正常增长还是别处出了异常。
      #
      # 不建议为了保险再往上加（比如 6144）：runner 只有 7GB，给别的进程留太少
      # 会换一种炸法。这个失败模式是**硬崩**（SIGABRT），不会先变慢给预警，
      # 所以真要涨也该是量完再涨。
      #
      # 不走「砍掉 examples/nodejs 的 types 把类型图缩小」那条路：那几个 types
      # 是 wdio 两个 spec 过 check-types 必需的，砍了会让 eslint 和 tsc 各说各话。
      - name: eslint（行数 / 复杂度）
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm eslint --no-cache .

      # 仓库自有的三条硬规则，本地由 lefthook 在提交前跑（只跑暂存的文件），
      # 这里对全仓补一道网。lefthook 那道 `git commit --no-verify` 一句就绕过了，
      # 所以服务端这一道才是真正拦得住的那个——依赖版本白名单尤其如此，
      # 发版这件事整个押在 package.json 的版本号写法正确上。
      #
      # 三个脚本都只认「文件列表」参数，文件列表必须显式喂进去。
      # check-package-json.js 传空会 exit 1（它自己就把「零文件」当失败）；
      # 另外两个传空只会打印「没有文件需要检查」然后 exit 0——那是空跑，不是通过，
      # 而且它们成功时也不打检查计数，日志上「全过了」和「一个都没查」一字不差。
      # 所以在调用之前先断言两张列表非空：哪天 glob 写错、或者文件被整体挪走，
      # 要的是一次响亮的失败，而不是一次安静的全绿。
      #
      # 用 git ls-files 而不是 find：只有进了版本库的文件才该被检查，
      # 顺带天然排除 node_modules 与各 app 的构建产物。
      - name: 仓库自有规则
        run: |
          set -euo pipefail
          files=$(git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' '*.cjs' '*.mjs' '*.cts' '*.mts')
          pkg_files=$(git ls-files '**/package.json' 'package.json')
          if [ -z "$files" ]; then
            echo "::error::源码文件列表为空，check-tailwind / check-file-rules 会空跑成假绿"
            exit 1
          fi
          if [ -z "$pkg_files" ]; then
            echo "::error::package.json 列表为空，依赖版本白名单这一道等于没跑"
            exit 1
          fi
          echo "待检查：$(echo "$files" | wc -l) 个源码文件，$(echo "$pkg_files" | wc -l) 个 package.json"
          # 故意不加引号：这里要的就是按空白拆成多个参数（仓库内无带空格的路径）。
          node scripts/check-tailwind.js $files
          node scripts/check-file-rules.js $files
          node scripts/check-package-json.js $pkg_files

      # 门禁脚本自己的单测。它们是 `node --test` 的 .test.mjs，落在 scripts/ 与
      # eslint-rules/ 下；而 vitest 每个 project 的 include 都是 `src/**/*.test.ts`，
      # 所以 `pnpm test` 一个都跑不到——不在这里跑，就是谁都不跑。
      # 门禁自身写错（比如豁免写宽了、判定漏了一类）不会有任何信号，
      # 而门禁失灵的表现恰恰是「全绿」，本仓在假绿上翻过车，这道必须有。
      - name: 门禁脚本自测
        run: node --test scripts/*.test.mjs eslint-rules/*.test.mjs

      # apps/web/public/install-agent-skill.sh 里内嵌着 .claude/skills/ 两个 skill
      # 的正文（它是发给用户的单文件离线安装器，正文必须在它自己肚子里）。
      # 内嵌的那份是生成物：改了 skill 却忘了重新生成，用户装到的就是旧的一套，
      # 而这种漂移在本地看不出来——所以在这里卡一道。
      # 注意：skill 源（.claude/skills/）已移出版本库，由 dev-cli 同步、被 gitignore，
      # CI 里取不到源，脚本在缺源时会打印提示并跳过（退出 0）。所以这道只在本地
      # 同步过 skill 的机器上真正生效；改了 skill 后须在本地重新生成并提交。
      # 失败时的修法：node scripts/build-install-agent-skill.js
      - name: 安装脚本内嵌的 skill 未漂移
        run: node scripts/build-install-agent-skill.js --check

      # dsh 插件中的 skill 是 .claude/skills/ 的副本。缺少源时脚本跳过（退出 0），原因同上。
      # 失败时的修法：node scripts/build-dsh-plugin-skills.js
      - name: dsh 插件中的 skill 未漂移
        run: node scripts/build-dsh-plugin-skills.js --check

  docker:
    name: 构建镜像 (${{ matrix.app }})
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [web, server]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # main 上的推送和手动运行才登录并推镜像。PR 只构建，不推。
      # 外部 fork 发来的 PR 拿不到 ACR 的凭据，所以这个条件也是一道防线。
      - name: 检查 ACR 配置
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          missing=""
          for key in ACR_REGISTRY ACR_NAMESPACE ACR_USERNAME ACR_PASSWORD; do
            if [ -z "${!key}" ]; then
              missing="${missing} ${key}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::缺少 ACR 配置：${missing}。ACR_REGISTRY 和 ACR_NAMESPACE 是仓库 Variables，ACR_USERNAME 和 ACR_PASSWORD 是仓库 Secrets。说明见 README「准备镜像仓库」。"
            exit 1
          fi

      - name: 登录 ACR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 只在 main 上、且是 web 时校验：localhost 兜底只对 PR 构建有意义。
      # 推到 ACR 后，这个镜像的页面能打开，但请求全部发向访客自己的 localhost。
      # server 镜像不写入这个变量，不受影响。
      - name: 校验 VITE_SERVER_URL 已配置
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.app == 'web'
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: |
          if [ -z "${VITE_SERVER_URL}" ]; then
            echo "::error::仓库变量 VITE_SERVER_URL 未配置。web 镜像在构建时把它写进前端产物。请到 Settings -> Secrets and variables -> Actions -> Variables 把它设为站点地址，例如 https://testcases.logwing.com。"
            exit 1
          fi
          echo "::notice::web 镜像将写入 VITE_SERVER_URL=${VITE_SERVER_URL}"

      # 服务器上的 make up:prod 按当前提交拉取镜像，它使用短 tag：sha- 加上提交的前 7 位。
      # fork 的 PR 读不到仓库变量，所以镜像名有兜底值。PR 不推镜像，这个名字不会被使用。
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.ACR_REGISTRY || 'local' }}/${{ vars.ACR_NAMESPACE || 'automationstack' }}/automationstack-${{ matrix.app }}
          tags: |
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # 两个 Dockerfile 的 context 都是仓库根，因为 pnpm workspace 的构建需要整个 monorepo。
      #
      # VITE_SERVER_URL 只对 web 有意义。它在构建时写进前端产物，运行时不能修改。
      # 修改地址后必须重新构建镜像，重启没有用。它是公开的地址，不是密钥，所以放在 Variables 中。
      # 标签 automationstack.server-url 记录这个值。make up:prod 用它检查镜像与 DOMAIN 是否相同。
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          # ACR 个人版拒绝 buildx 默认的证明清单（application/vnd.oci.empty.v1+json），所以关闭它。
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            automationstack.server-url=${{ vars.VITE_SERVER_URL || 'http://localhost:3000' }}
          build-args: |
            VITE_SERVER_URL=${{ vars.VITE_SERVER_URL || 'http://localhost:3000' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
