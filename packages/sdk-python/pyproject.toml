# 构建后端用 hatchling：它自己不拉任何运行时依赖，也不需要 setup.py。
# 换句话说，装这个包的人拿到的传递依赖仍然是零——这正是本包的卖点（§7.3）。
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "automationstack-sdk"
version = "0.1.0"
description = "把一轮自动化测试结果批量上报到 automationstack 的 ingest 端点，并原样打印对账单"
readme = "README.md"
# 3.9 是 macOS 自带的那个版本，QA 的本机上常常就是它，砍掉它等于逼人先装 Python。
# 代价是全库 `from __future__ import annotations` + 不用 `X | Y` 写法。
requires-python = ">=3.9"
license = { text = "UNLICENSED" }

# ⚠️ 这里必须一直是空的。
# 附件走预签名 PUT（D28），只需要标准库的 urllib；幂等键只需要 hashlib/uuid。
# 用户不该为了上报一次结果被迫装 requests、boto3 或任何测试框架。
# `tests/test_no_preflight.py` 会读这份文件断言它是空的。
dependencies = []

[project.urls]
Repository = "https://github.com/automationstack/automationstack"

[dependency-groups]
# 测试依赖不进 `project.optional-dependencies`：那个表是给**用户**装的 extra，
# 放进去等于让「零依赖」这件事变得要看用户装了哪个 extra 才能回答。
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/automationstack_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 插件那个包也会被装进同一个环境，别让它的 conftest 混进来。
addopts = "-p no:cacheprovider"
